server {
    listen 80;
    server_name localhost;

    # Allow photo uploads to pass through (backend handles multipart);
    # nginx's 1m default would otherwise reject them.
    client_max_body_size 25m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # This is CRITICAL for React Router.
        # If the file doesn't exist, route the request back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend so the SPA can use same-origin relative
    # URLs (/api/...). This makes the app work from any host/IP on the LAN
    # without baking an absolute API URL into the build. The trailing slash on
    # proxy_pass strips the /api/ prefix (backend routes live at the root).
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploaded photos are served by the backend's static handler.
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
